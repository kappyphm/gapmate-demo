services:
  postgres:
    image: postgres:16-alpine
    container_name: gapmate-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gapmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gapmate}
      POSTGRES_DB: ${POSTGRES_DB:-gapmate}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gapmate} -d ${POSTGRES_DB:-gapmate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  analysis_api:
    build:
      context: ./services/analysis_api
      dockerfile: Dockerfile
    container_name: gapmate-analysis-api
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-gemini-embedding-001}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal-key}
      DATA_DIR: /data
    ports:
      - "${ANALYSIS_API_PORT:-8001}:8001"
    volumes:
      - ./services/analysis_api:/app
      - ./data:/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  core_api:
    build:
      context: ./services/core_api
      dockerfile: Dockerfile
    container_name: gapmate-core-api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://gapmate:gapmate@postgres:5432/gapmate}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ANALYSIS_API_URL: ${ANALYSIS_API_URL:-http://analysis_api:8001}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal-key}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-5173}
    ports:
      - "${CORE_API_PORT:-8000}:8000"
    volumes:
      - ./services/core_api:/app
    depends_on:
      postgres:
        condition: service_healthy
      analysis_api:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: node:22-alpine
    container_name: gapmate-web
    working_dir: /app
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"
    depends_on:
      - core_api

volumes:
  pgdata:
  web_node_modules:
